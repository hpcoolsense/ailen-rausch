<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230e0d0c'/%3E%3Ctext x='32' y='46' font-family='Georgia, serif' font-weight='400' font-size='40' text-anchor='middle' fill='%23ece6dc'%3Ea%3C/text%3E%3C/svg%3E">
<title>ailen — rausch</title>
<meta name="description" content="Ailen Rausch — estilismo, diseño y fotografía de moda. Córdoba, Argentina.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* Variante C · «Campaña» — inspirada en palomawool.com (fotos a sangre, serif chica, nombre vertical en el borde)
     y en artpartner.com (archivo en collage con el nombre del cliente sobre cada imagen).
     El cine como hilo: Yegua Studio arranca de películas, así que los servicios cierran como créditos. */
  :root {
    --bg: #0e0d0c;
    --ink: #ece6dc;
    --mute: #91897d;
    --line: #2b2825;
    --pad: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 15px/1.38 "EB Garamond", Garamond, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  img, video { display: block; width: 100%; height: 100%; object-fit: cover; background: #1a1816; }
  em, .it { font-style: italic; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  /* Chrome fijo: se lee sobre cualquier foto gracias al difference */
  .side, .nav { position: fixed; z-index: 40; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,.35), 0 0 2px rgba(0,0,0,.25); }
  .side { left: 12px; top: 18px; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 15px; letter-spacing: .02em; }
  .nav { top: 0; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; padding: 16px 60px; font-size: 14px; }
  .nav .r { position: absolute; right: var(--pad); top: 16px; }
  .nav a:hover, .side:hover { font-style: italic; }

  /* Portada: tres videos verticales de Yegua Studio, a sangre */
  .hero { height: 100svh; display: grid; grid-template-columns: repeat(3, 1fr); position: relative; }
  .hero video { height: 100svh; }
  .hero .cap { position: absolute; left: 0; right: 0; bottom: 18px; padding: 0 var(--pad) 0 48px; display: flex; justify-content: space-between; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,.35); font-size: 15px; }

  .intro { padding: 18vh var(--pad) 16vh; text-align: center; }
  .intro h1 { font-weight: 400; font-style: italic; font-size: clamp(36px, 5vw, 84px); line-height: 1.02; letter-spacing: -.01em; max-width: 14em; margin: 0 auto; }
  .intro p { max-width: 36em; margin: 34px auto 0; color: var(--mute); font-size: 17px; }

  /* Capítulos a sangre */
  .ch { position: relative; height: 100svh; display: block; overflow: hidden; }
  .ch img, .ch video { height: 100%; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .ch:hover img { transform: scale(1.015); }
  .ch .lab {
    position: absolute; left: 48px; right: var(--pad); bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;
    color: #fff; text-shadow: 0 1px 14px rgba(0,0,0,.35); gap: 20px;
  }
  .ch .lab b { display: block; font-weight: 400; font-style: italic; font-size: clamp(26px, 2.6vw, 42px); line-height: 1; margin-bottom: 6px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin: 2px 0; }
  .two .ch { height: 92svh; }
  .two .ch .lab b { font-size: clamp(22px, 1.9vw, 30px); }

  /* Archivo en collage */
  .sec-t { padding: 16vh var(--pad) 40px 48px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .sec-t h2 { font-weight: 400; font-style: italic; font-size: clamp(40px, 6vw, 100px); line-height: 1; }
  .sec-t span { color: var(--mute); }
  .arch { columns: 4; column-gap: 14px; padding: 0 var(--pad) 0 48px; }
  .arch a { display: block; break-inside: avoid; margin-bottom: 14px; position: relative; }
  .arch img { height: auto; }
  .arch .nm {
    position: absolute; inset: auto 0 0 0; padding: 14px; color: #fff; text-transform: uppercase; letter-spacing: .04em;
    font-size: clamp(18px, 1.8vw, 28px); line-height: 1; text-shadow: 0 1px 16px rgba(0,0,0,.45);
  }
  .arch .nm small { display: block; text-transform: none; letter-spacing: 0; font-style: italic; font-size: 14px; margin-top: 6px; opacity: .9; }
  .arch a:hover .nm { font-style: italic; }

  /* Servicios como créditos de cierre */
  .credits { padding: 22vh var(--pad) 14vh; text-align: center; }
  .credits .pre { color: var(--mute); font-style: italic; margin-bottom: 64px; }
  .credits dl { display: grid; grid-template-columns: 1fr 1fr; gap: 50px 46px; max-width: 980px; margin: 0 auto; text-align: left; }
  .credits dt { text-align: right; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; padding-top: 5px; }
  .credits dt span { display: block; color: var(--mute); letter-spacing: .04em; margin-bottom: 4px; }
  .credits dd p { font-size: 18px; max-width: 30em; }
  .credits dd small { display: block; margin-top: 8px; color: var(--mute); font-style: italic; font-size: 15px; }
  .credits dd small a:hover { color: var(--ink); }
  .credits .fin { margin-top: 18vh; font-style: italic; font-size: clamp(40px, 7vw, 120px); line-height: 1; }
  .credits .who { margin-top: 18px; color: var(--mute); }
  .credits .links { margin-top: 34px; display: flex; gap: 34px; justify-content: center; font-size: 22px; }
  .credits .links a { border-bottom: 1px solid var(--mute); }
  .credits .links a:hover { font-style: italic; }
  footer { padding: 20px var(--pad) 26px 48px; display: flex; justify-content: space-between; color: var(--mute); border-top: 1px solid var(--line); }

  /* Serie: galería horizontal (#/id) */
  .sr { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
  .sr[hidden] { display: none; }
  .sr-top { display: flex; justify-content: space-between; padding: 16px var(--pad) 0 48px; font-size: 14px; flex: none; }
  .sr-top .cnt { color: var(--mute); }
  .sr-top a:hover { font-style: italic; }
  .strip {
    flex: 1; display: flex; gap: 10px; align-items: center; overflow-x: auto; overflow-y: hidden;
    padding: 0 var(--pad) 0 48px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: #3a3632 transparent;
  }
  .strip > * { flex: none; height: min(80svh, 1000px); width: auto; scroll-snap-align: center; object-fit: contain; }
  .strip .txt { width: min(420px, 80vw); height: auto; align-self: flex-end; padding-bottom: 6svh; padding-right: 30px; scroll-snap-align: start; }
  .strip .txt h1 { font-weight: 400; font-style: italic; font-size: clamp(40px, 4.6vw, 76px); line-height: .98; margin-bottom: 18px; }
  .strip .txt .meta { color: var(--mute); margin-bottom: 18px; }
  .strip .txt p { font-size: 17px; }
  .strip .end { width: 300px; height: auto; align-self: center; padding-left: 30px; }
  .strip .end a { font-style: italic; font-size: 30px; line-height: 1.05; display: block; }
  .sr-bot { display: flex; justify-content: space-between; padding: 0 var(--pad) 16px 48px; color: var(--mute); font-size: 14px; flex: none; }

  .variantes { position: fixed; right: 12px; bottom: 10px; z-index: 70; font-size: 13px; color: #fff; mix-blend-mode: difference; }
  .sr:not([hidden]) ~ .variantes { display: none; }

  /* Mobile: aditivo */
  @media (max-width: 820px) {
    :root { --pad: 16px; }
    .nav { justify-content: flex-start; gap: 14px; padding: 14px 16px 0 40px; font-size: 14px; overflow-x: auto; white-space: nowrap; }
    .nav .r { display: none; }
    .side { left: 10px; top: 14px; font-size: 14px; }
    .hero { grid-template-columns: 1fr; }
    .hero video:not(:nth-child(2)) { display: none; }
    .hero .cap { padding-left: 40px; }
    .hero .cap span { display: none; }
    .intro { padding: 12vh 22px 10vh; }
    .ch { height: 82svh; }
    .ch .lab { left: 40px; flex-direction: column; align-items: flex-start; gap: 6px; }
    .two { grid-template-columns: 1fr; }
    .two .ch { height: 82svh; }
    .sec-t { padding-left: 40px; flex-direction: column; gap: 8px; }
    .arch { columns: 2; column-gap: 8px; padding-left: 40px; }
    .arch a { margin-bottom: 8px; }
    .arch .nm { padding: 10px; }
    .credits dl { grid-template-columns: 1fr; gap: 10px; text-align: center; }
    .credits dt { text-align: center; padding-top: 30px; }
    .credits dd p { margin: 0 auto; }
    .credits .links { flex-direction: column; gap: 12px; align-items: center; }
    footer { padding-left: 40px; flex-direction: column; gap: 4px; }
    .sr-top, .sr-bot { padding-left: 40px; }
    .strip { flex-direction: column; align-items: stretch; overflow-x: hidden; overflow-y: auto; padding: 10px 16px 30px 40px; gap: 8px; scroll-snap-type: none; }
    .strip > * { height: auto; width: 100%; }
    .strip .txt { width: 100%; padding: 20px 0 16px; align-self: auto; }
    .strip .end { width: 100%; padding: 30px 0; }
  }
</style>
</head>
<body>

<a class="side" href="#">ailen — rausch</a>
<nav class="nav" aria-label="Secciones">
  <a href="#capitulos">Trabajos</a>
  <a href="#archivo">Archivo</a>
  <a href="#creditos">Servicios</a>
  <a href="#contacto">Contacto</a>
  <span class="r">Córdoba, AR</span>
</nav>

<main id="main"></main>

<section class="sr" id="sr" hidden role="dialog" aria-modal="true"></section>

<a class="variantes" href="../index.html">← variantes</a>

<script src="../assets/proyectos.js"></script>
<script>
(() => {
  const A = '../assets/';
  const P = window.PROYECTOS, S = window.SERVICIOS, PF = window.PERFIL;
  const byId = Object.fromEntries(P.map(p => [p.id, p]));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const img = (id, k, sizes, eager) => {
    const p = byId[id], [src, w, h] = p.imgs[k];
    return `<img src="${A}${src}.webp" srcset="${A}${src}-s.webp 720w, ${A}${src}.webp 2000w" sizes="${sizes}"
      width="${w}" height="${h}" alt="${esc(p.titulo)} — ${esc(p.rol)}" ${eager ? '' : 'loading="lazy"'} decoding="async">`;
  };
  const vid = (id, k, extra = '') => {
    const v = byId[id].videos[k];
    return `<video src="${A}${v[0]}" poster="${A}${v[1]}" width="${v[2]}" height="${v[3]}" muted loop playsinline autoplay preload="metadata" ${extra} aria-label="${esc(byId[id].titulo)}"></video>`;
  };
  const lab = p => `<span class="lab"><span><b>${esc(p.titulo)}</b>${esc(p.rol)} · ${esc(p.bajada)} · ${p.anio}</span><span class="it">ver la serie →</span></span>`;
  const ch = (id, media, rotulo = true) => `<a class="ch" href="#/${id}" aria-label="${esc(byId[id].titulo)}">${media}${rotulo ? lab(byId[id]) : ''}</a>`;
  const two = (a, b) => `<div class="two">${a}${b}</div>`;
  const half = '(max-width:820px) 100vw, 50vw';
  const [mail, ig] = [PF.mail ? `mailto:${PF.mail}` : '#contacto', PF.instagram ? `https://instagram.com/${PF.instagram}` : '#contacto'];

  document.getElementById('main').innerHTML = `
    <section class="hero" aria-label="Yegua Studio">
      ${vid('yegua', 0)}${vid('yegua', 1)}${vid('yegua', 2)}
      <div class="cap"><a href="#/yegua"><em>Yegua Studio</em> — colección ${byId.yegua.anio}</a><span>estilismo · diseño · fotografía de moda</span></div>
    </section>

    <section class="intro">
      <h1>Estilismo, diseño y fotografía de moda desde Córdoba, Argentina.</h1>
      <p>${esc(PF.bio)}</p>
    </section>

    <div id="capitulos">
      ${ch('victoria', img('victoria', 5, '100vw'))}
      ${two(ch('victoria', vid('victoria', 0), false), ch('victoria', img('victoria', 3, half), false))}
      ${ch('yegua', img('yegua', 1, '100vw'))}
      ${two(ch('virgenxita', img('virgenxita', 0, half)), ch('virgenxita', img('virgenxita', 2, half), false))}
      ${ch('sartessa', img('sartessa', 8, '100vw'))}
      ${two(ch('sartessa', img('sartessa', 0, half), false), ch('fichas', img('fichas', 0, half)))}
      ${two(ch('isca', img('isca', 1, half)), ch('h1', img('h1', 4, half)))}
      ${ch('emilia', img('emilia', 9, '100vw'))}
      ${two(ch('nahuel', img('nahuel', 0, half)), ch('anto', img('anto', 0, half)))}
      ${ch('vereda', img('vereda', 2, '100vw'))}
    </div>

    <div class="sec-t" id="archivo"><h2>Archivo</h2><span>${P.length} proyectos · 2024—2026</span></div>
    <section class="arch">
      ${P.map((p, i) => {
        const k = { victoria: 0, yegua: 0, sartessa: 3, fichas: 2, tizzi: 1, vereda: 0 }[p.id] ?? 0;
        return `<a href="#/${p.id}">${img(p.id, k, '(max-width:820px) 50vw, 25vw')}<span class="nm">${esc(p.titulo)}<small>${esc(p.rol)}, ${p.anio}</small></span></a>`;
      }).join('')}
    </section>

    <section class="credits" id="creditos">
      <p class="pre">con la participación de</p>
      <dl>
        ${S.map(s => `<dt><span>${s.n}</span>${s.titulo}</dt><dd><p>${s.texto}</p><small>${s.proyectos.map(id => `<a href="#/${id}">${esc(byId[id].titulo)}</a>`).join(' · ')}</small></dd>`).join('')}
      </dl>
      <div id="contacto">
        <p class="fin">Escribime.</p>
        <p class="who">${PF.nombre} — ${PF.oficio} — ${PF.base}</p>
        <div class="links"><a href="${mail}">Mail</a><a href="${ig}">Instagram</a></div>
      </div>
    </section>
    <footer><span>ailen — rausch</span><span>${PF.base}</span></footer>`;

  // Serie (#/id): tira horizontal; la rueda vertical la mueve de costado
  const sr = document.getElementById('sr');
  function open(p) {
    const i = P.indexOf(p), next = P[(i + 1) % P.length];
    const media = [
      ...p.imgs.slice(0, 1).map((_, k) => img(p.id, k, '60vw', true)),
      ...p.videos.map((v, k) => vid(p.id, k)),
      ...p.imgs.slice(1).map((_, k) => img(p.id, k + 1, '60vw')),
    ];
    sr.innerHTML = `
      <div class="sr-top"><a href="#_">← cerrar</a><span class="cnt">${p.categoria} · ${media.length} imágenes</span><a href="#/${next.id}">siguiente →</a></div>
      <div class="strip" id="strip">
        <div class="txt"><h1>${esc(p.titulo)}</h1><p class="meta">${esc(p.rol)} · ${esc(p.bajada)} · ${p.anio}${p.creditos ? `<br>${esc(p.creditos)}` : ''}</p><p>${esc(p.texto)}</p></div>
        ${media.join('')}
        <div class="end"><span class="it" style="color:var(--mute)">siguiente</span><a href="#/${next.id}">${esc(next.titulo)} →</a></div>
      </div>
      <div class="sr-bot"><span>${p.anio}</span><span>desplazá →</span></div>`;
    const st = document.getElementById('strip');
    st.addEventListener('wheel', e => {
      if (matchMedia('(max-width: 820px)').matches || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      st.scrollLeft += e.deltaY; e.preventDefault();
    }, { passive: false });
  }
  function route() {
    const id = location.hash.replace(/^#\/?/, '');
    if (location.hash.startsWith('#/') && byId[id]) {
      open(byId[id]); sr.hidden = false; document.documentElement.style.overflow = 'hidden';
    } else if (!sr.hidden) {
      sr.hidden = true; sr.innerHTML = ''; document.documentElement.style.overflow = '';
    }
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', e => {
    if (sr.hidden) return;
    if (e.key === 'Escape') location.hash = '_';
    const st = document.getElementById('strip');
    if (e.key === 'ArrowRight') st.scrollBy({ left: innerWidth * .6, behavior: 'smooth' });
    if (e.key === 'ArrowLeft') st.scrollBy({ left: -innerWidth * .6, behavior: 'smooth' });
  });
  route();
})();
</script>
</body>
</html>
